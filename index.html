<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentrax — Inteligência para o fluxo hospitalar</title>
    <meta name="description" content="Valentrax Healthcare Operations — plataforma de inteligência operacional para saúde: indicadores assistenciais, ocupação, giro de leitos, SCIH e desempenho institucional em um único ambiente analítico." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      /* ── Tema Valentrax (claro/escuro) ── valores padrão = ESCURO (azul-marinho corporativo) */
      :root {
        --bg:#0c1220; --bg-2:#101a2c; --surface:#142238; --surface-2:#121e33; --surface-3:#1a2a44;
        --input-bg:#0d1728; --border:#22334f; --border-2:#2e4368;
        --text:#e9eef5; --text-2:#c9d4e3; --text-3:#8fa2bd; --text-muted:#5b6f8f;
      }
      :root[data-theme="light"] {
        --bg:#eef1f5; --bg-2:#ffffff; --surface:#ffffff; --surface-2:#f7f9fb; --surface-3:#edf1f6;
        --input-bg:#f2f5f8; --border:#d9e0e8; --border-2:#c4cfdc;
        --text:#16202e; --text-2:#31404f; --text-3:#54657a; --text-muted:#8595a8;
      }
      body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

      /* ── O MENU EM TELA BAIXA ──────────────────────────────
         🔴 Medido em 07/10/2026, num 1366×768: o menu tem 832px de conteúdo
         para 661px de altura. QUATRO dos dezessete itens ficam fora da
         primeira vista — Imprimir Dashboard, Auditoria, Importar Dados e
         Usuários e Perfis. Há barra de rolagem nativa, então não é invisível;
         mas 1366×768 é o monitor comum de recepção, e num notebook real a
         barra do navegador come mais uns 100px, o que piora a conta.

         Pesa mais do que parece: "Usuários e Perfis" é onde o hospital
         atribui os cargos — e cargo é o que decide acesso a dado clínico;
         "Auditoria" é exigência legal (pep_acessos).

         🔒 A ORDEM NÃO MUDA. Ela é o caminho do trabalho (atende → trata →
         confere → fatura → apoio) e o grupo APOIO E TI é último de propósito.
         Subir os itens escondidos "resolveria" a vista e quebraria o
         princípio: o problema é CABER, não ordenar.

         Por que CSS aqui e não estilo inline no App.jsx: o App.jsx é
         território compartilhado, e altura de janela não se lê em estilo
         inline sem um ouvinte de resize. Uma media query de ALTURA resolve
         sem JavaScript e sem disputar o arquivo.

         O `!important` é necessário e não é preguiça: o estilo inline do
         elemento vence qualquer seletor, e é justamente o padding inline
         que precisa ceder. Fica restrito aos três ganchos do menu. */
      @media (max-height: 860px) {
        .vx-nav-grupo { padding-top: 9px !important; padding-bottom: 3px !important; }
        .vx-nav-item  { padding-top: .32rem !important; padding-bottom: .32rem !important; }
        .vx-nav       { padding-top: .4rem !important; padding-bottom: .4rem !important; }
      }

      /* Segunda faixa: o notebook de 768 REAL, depois que a barra do
         navegador come ~130px. Medido: com a faixa de cima sozinha, os mesmos
         quatro itens continuavam fora aos 640px de viewport.
         Aqui o cabeçalho de grupo perde a linha inteira de respiro e o item
         fica no mínimo legível. Abaixo disto não se aperta mais sem a barra
         virar um borrão — e aí a rolagem nativa volta a ser a resposta certa,
         porque esconder texto é pior que rolar. */
      @media (max-height: 700px) {
        .vx-nav-grupo { padding-top: 6px !important; padding-bottom: 1px !important;
                        font-size: 9.5px !important; line-height: 1.1 !important; }
        .vx-nav-item  { padding-top: .2rem !important; padding-bottom: .2rem !important; }
        .vx-nav       { padding-top: 2px !important; padding-bottom: 2px !important; }
      }
    </style>
    <script>try{document.documentElement.setAttribute('data-theme', localStorage.getItem('hnsn_theme')||'dark')}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <!-- As credenciais do Supabase vêm das variáveis VITE_SUPABASE_URL / VITE_SUPABASE_KEY
         (configuradas na Vercel e no .env local). Ver README / .env.example. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
